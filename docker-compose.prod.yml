services:
  postgres:
    image: postgres:16-alpine
    container_name: waak-prod-postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-waak_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-waak_commerce_prod}
    # Security: Database is internal only, never exposed to public internet
    expose:
      - "5432"
    volumes:
      - waak_prod_pgdata:/var/lib/postgresql/data
      - ./backend/src/db/migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-waak_admin} -d ${POSTGRES_DB:-waak_commerce_prod}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - waak-prod-net

  redis:
    image: redis:7-alpine
    container_name: waak-prod-redis
    restart: always
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD}"]
    # Security: Redis is internal only, never exposed to public internet
    expose:
      - "6379"
    volumes:
      - waak_prod_redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - waak-prod-net

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: waak-prod-backend
    restart: always
    environment:
      NODE_ENV: production
      PORT: 9000
      DATABASE_URL: postgres://${POSTGRES_USER:-waak_admin}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-waak_commerce_prod}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
      JWT_SECRET: ${JWT_SECRET}
      CORS_ORIGIN: ${CORS_ORIGIN}
      RAZORPAY_KEY_ID: ${RAZORPAY_KEY_ID:-rzp_test_waak2026demo}
      RAZORPAY_KEY_SECRET: ${RAZORPAY_KEY_SECRET}
      RAZORPAY_WEBHOOK_SECRET: ${RAZORPAY_WEBHOOK_SECRET}
      ALLOW_MOCK_PAYMENTS: ${ALLOW_MOCK_PAYMENTS:-false}
      ADMIN_EMAIL: ${ADMIN_EMAIL}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      SHIPROCKET_EMAIL: ${SHIPROCKET_EMAIL:-}
      SHIPROCKET_PASSWORD: ${SHIPROCKET_PASSWORD:-}
      SHIPROCKET_PICKUP_PINCODE: ${SHIPROCKET_PICKUP_PINCODE:-110033}
    expose:
      - "9000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:9000/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s
    networks:
      - waak-prod-net

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: waak-prod-frontend
    restart: always
    expose:
      - "80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:80/"]
      interval: 15s
      timeout: 5s
      retries: 3
    networks:
      - waak-prod-net

  nginx-proxy:
    image: nginx:alpine
    container_name: waak-prod-gateway
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.prod.conf:/etc/nginx/conf.d/default.conf:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
      - waak_certbot_www:/var/www/certbot:ro
    depends_on:
      - frontend
      - backend
    networks:
      - waak-prod-net

networks:
  waak-prod-net:
    driver: bridge

volumes:
  waak_prod_pgdata:
  waak_prod_redisdata:
  waak_certbot_www:
