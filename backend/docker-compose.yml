services:
  postgres:
    image: postgres:16-alpine
    container_name: waak-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: waak_admin
      POSTGRES_PASSWORD: waak_secret_2026
      POSTGRES_DB: waak_commerce
    ports:
      - "5432:5432"
    volumes:
      - waak_pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: waak-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - waak_redisdata:/data

volumes:
  waak_pgdata:
  waak_redisdata:
